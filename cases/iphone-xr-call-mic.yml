# ITサポート ナレッジベース 事例(2件目 / 診断層スキーマの検証)
#
# この事例は README「次にやること」で検討中だった診断層を試すもの:
#   diagnosis(切り分け) / cause(なぜ起きるか) / resolution(対処) /
#   verification(直った確認) / caveats(注意・落とし穴)
# 1件目(outlook-pst-migration)は本文=resolution中心で薄かった。本件は真因が
# 断定できず切り分けが主役になるため、診断層が要るかの検証に向く。
#
# 位置づけ: 貸与端末(会社支給 iPhone XR)のサポート事例。真因未確定のため status: draft。
#           成果は「根治」ではなく「運用回避」である点に注意(caveats参照)。

meta:
  updated: "2026-09-18"
  maintainer: "Kiro (AI保守) + 情シス"
  purpose: "AIが関連性を橋渡しするための構造化事例ベース。人間向け手順書は生成物。"
  note: "真因未確定(有力仮説どまり)。回避策で運用する前提の事例。診断層スキーマの試験導入。"

cases:
  - id: iphone-xr-call-mic
    title: "貸与iPhone XRで、通常(耳当て)通話だけ相手に声が聞き取りにくい"
    category: モバイル/通話
    symptoms:
      - "電話で相手が自分の声を聞き取りにくいと言う"
      - "通話相手に声がこもる・切れ切れ・雑音交じりと言われる"
      - "スピーカーモードなら相手に普通に聞こえるが、耳に当てる通常モードだと悪い"
      - "スピーカーだと問題ないのにマイク通話(耳当て)だと相手に届く声が悪い"
    context:
      - "会社貸与のiPhone XRでの音声通話"
      - "耳に当てる通常モードでの発話(送話側の問題)"
      - "新品・使い始めから発生(後天的な劣化・詰まりではない)"
    # --- 診断(切り分け): 同じ症状でも原因が複数ありうるので、除外の道筋を残す ---
    diagnosis:
      - step: "スピーカーモードで相手に正常に聞こえるか"
        result: "正常 → 回線・電波・相手側・受話側の線が薄まる。送話(マイク)側 or モード依存の処理を疑う"
      - step: "ボイスメモで録音して再生(下部メインマイクの単体確認)"
        result: "正常 → 下部マイク素子は生きている。単純な物理故障・詰まりではない"
      - step: "フロントカメラで動画撮影して音声確認(上部マイクの単体確認)"
        result: "正常 → 上部マイク素子も生きている"
      - step: "電話ノイズキャンセリングをOFFにして比較(設定>アクセシビリティ>オーディオ/ビジュアル)"
        result: "変化なし → モードごとのノイズ処理設定が主因ではない"
      - step: "別アプリ(LINEWORKS等)・別の電波環境で再現するか"
        result: "アプリ・電波に依存せず再現 → キャリア回線/VoLTE/コーデック/電波の線を除外。本体側の要因"
      - step: "背面マイク・上部マイクを指で塞いで変化を見る"
        result: "変化なし → 特定マイクの拾いすぎ(干渉源)ではない"
      - step: "下部マイクを手で覆い、声が回り込むようにする"
        result: "劇的に改善 → 通常持ちだと下部マイクへの入力が弱く、複数マイク合成が主音源を確定できず破綻していると推定"
      - step: "iOSバージョン確認(設定>一般>情報)"
        result: "iPhone XRの最終系 iOS 18.7.x(例: 18.7.9 / 18.7.10)。メジャー更新は打ち止め=ソフト修正の伸びしろなし"
    cause: >
      真因は未確定。有力仮説は「iPhone XRの通話時マイク処理(複数マイクの合成/ビームフォーミング)の特性で、
      通常の耳当て持ちだと下部マイクへの声の入力が弱く、主音源の判定が不安定になり、送話がこもる・切れる」。
      各マイク素子は単体では正常(ボイスメモ・フロントカメラ録音が良好)なので、素子の物理故障や詰まりではない。
      XR世代で同様の訴え(スピーカーは正常/マイク通話だけ聞き取りにくい)がネット上に散見される点とも整合する。
      ただしAppleが認めた公式欠陥という一次情報は確認できておらず、個体差の可能性も残る。
    root_cause: "iPhone XRの通話時マイク処理特性(複数マイク合成)による送話品質低下の疑い。素子故障・詰まりではない(仮説/未確定)"
    targets: ["iPhone XR", "本体マイク(下部/上部/背面)", "通話(耳当てモード)", "iOS 18.7.x"]
    resolution:
      - "根治手段は現状なし(ソフトはXR最終系18.7.xで更新打ち止め、素子は正常)。以下は運用回避:"
      - "有線またはBluetoothイヤホンのマイクを使う(本体マイクの集音特性を回避でき最も安定)"
      - "スピーカーモードで通話する(相手には正常に聞こえることを確認済み)"
      - "やむを得ず耳当てで話す場合は、下部(充電端子側)を口元に寄せる持ち方にする"
      - "念のため『すべての設定をリセット』(データは消えない)で音声ルーティングの不整合を排除(効果は限定的)"
    verification:
      - "回避策適用後、相手に『こもり・切れ・雑音が解消したか』を実際の通話で確認する"
      - "イヤホンマイク使用時に相手が明瞭に聞こえれば、本体マイク処理の問題であることの裏付けにもなる"
    caveats:
      - "これは根治ではなく回避策。原因(機種特性の疑い)自体は解消していない"
      - "真因は未確定。Apple公式が認めた欠陥ではなく、個体差の可能性も残る"
      - "iPhone XRはメジャーOS更新が終了(iOS 18が最後)。iOSアップデートでの改善は期待できない"
      - "セキュリティ更新は18系ブランチで当面継続(少なくとも2027年後半頃までの見込み。公式確約ではない)"
      - "購入間もない/保証内で他個体より明らかに酷い場合のみ、初期不良としてApple/キャリアに相談する価値あり(ただしXR共通傾向なら交換しても再発しうる)"
      - "私物端末ではなく貸与端末のため本KB対象。私物であれば業務KBの範囲外になりうる"
    doc_ref: ""
    related:
      # 根が同じ事例は今のところなし。将来「通話品質」「マイク不良切り分け」系が増えたら繋ぐ
      []
    keywords:
      - "iPhone XR"
      - "通話"
      - "マイク"
      - "こもる"
      - "切れる"
      - "雑音"
      - "スピーカーは正常"
      - "耳当て"
      - "送話"
      - "貸与端末"
      - "iOS 18.7"
      - "LINEWORKS通話"
    severity: medium
    status: draft
