# ITサポート ナレッジベース 事例(3件目 / pst移行の派生トラブル)
#
# 位置づけ: PC入れ替えの過去メール(.pst)移行(outlook-pst-migration)の「移した後」に
#           起きる派生トラブル。pstをコピーできても、Outlookでインポート/読込時に
#           「アクセスが拒否されました」で開けない。関連性の橋渡し(related)の実例。
#
# 診断層(diagnosis/cause/resolution/verification/caveats)を継続採用。
# 真因は現象(エラーメッセージ)から強く推定だが、現場での解決確認が未取得のため status: draft。

meta:
  updated: "2026-09-18"
  maintainer: "Kiro (AI保守) + 情シス"
  purpose: "AIが関連性を橋渡しするための構造化事例ベース。人間向け手順書は生成物。"
  note: "pst移行の派生。真因は『pstのアクセス権/読み取り専用』と推定(未確認)。前所有者環境が原因という誤診に注意。"

cases:
  - id: outlook-pst-access-denied
    title: "移行した Outlook の .pst を開こうとすると『アクセスが拒否されました』で更新できない"
    category: メール
    symptoms:
      - "保護がかかっているのか更新ができない"
      - "過去メールの移行(以降)をしているが更新できない"
      - "データの吸い上げに何かの弊害があるみたい"
      - "pstにアクセスするための十分なアクセス権がありません と出る"
      - "移行したメールデータがOutlookで開けない/取り込めない"
    context:
      - "PC入れ替え(Win10→Win11)後の過去メール(.pst)移行作業中"
      - "旧PCからコピーした .pst を新PCのOutlookでインポート/読込しようとした場面"
      - "貸与PC(キッティング済み)での初回セットアップ直後"
    # --- 診断(切り分け): 前所有者環境のせい、という誤診に流れやすい ---
    diagnosis:
      - step: "エラーメッセージの本文を確認する"
        result: "『ファイル アクセスが拒否されました。ファイル ...\\受信メール.pst にアクセスするための十分なアクセス権がありません』"
      - step: "前所有者(工事課等)の環境が残っているせいか？を検討"
        result: "貸与PCはキッティング(クリーンインストール+設定マニュアル適用)済み。前所有者の残存が原因ではない → この線は除外"
      - step: "対象 .pst の場所と属性を確認"
        result: "Desktop等にコピーした .pst。コピー起因で『読み取り専用』属性、または旧環境のNTFSアクセス許可/所有者が引き継がれ、Outlookが書き込めない状態と推定"
    cause: >
      真因はエラー内容から『コピーした .pst に対する書き込み権限がないこと』が有力。
      具体的には (a) ファイルの『読み取り専用』属性が付いている、(b) 旧PC由来のNTFSアクセス許可/
      所有者が引き継がれ現ユーザーに書き込み権がない、(c) Outlookが書き込めない場所(保護されたフォルダ等)に
      置いている、のいずれか/複合。Outlookはpstを読み書きするため、書き込み不可だとインポート/読込で拒否される。
      「前所有者の環境が残っているせい」という誤診に流れやすいが、キッティング済みのため無関係。
    root_cause: "コピーした .pst の書き込み権限不足(読み取り専用属性 / 旧環境のNTFSアクセス許可・所有者の引き継ぎ)によりOutlookが開けない(推定/未確認)"
    targets: ["Outlook", ".pstファイル", "NTFSアクセス許可", "ファイル属性(読み取り専用)", "Windows 11"]
    resolution:
      - "対象 .pst を右クリック→プロパティで『読み取り専用』のチェックを外す"
      - "プロパティ→セキュリティで、現在のログインユーザーに『変更/フルコントロール』権限があるか確認し、無ければ付与(必要に応じて所有者を現ユーザーに変更)"
      - "pst を書き込み可能な場所(例: ...\\ドキュメント\\Outlook ファイル)へ置いてから読み込む"
      - "作業中はOutlookを終了しておく(起動中はpstを操作できないことがある)"
      - "その上で outlook-pst-migration の手順(同名pstの置き換え)を実施する"
    verification:
      - "Outlookでpstを読み込み/インポートし、アクセス拒否が出ずに過去メール・フォルダが表示されること"
      - "受信トレイ・送信済みなどのフォルダ階層が旧PC同様に見えること"
    caveats:
      - "真因はエラー内容からの推定。現場での解決確認は未取得のため status: draft"
      - "『保護がかかっている』はセキュリティソフトやBitLockerではなく、ファイルのアクセス権(読み取り専用/NTFS)が実体である可能性が高い"
      - "手順書は Win10→Win11 の新しい移行に更新が追いついていない。Live Mailの移行手順は既に使われないのに手順書に残存している点も要整理"
      - "同一スレッドで発生していたExcel(管理簿配布予定表)のSQL Server ODBC接続エラーは、本件(メール移行)とは無関係の別トラブル。混同しないこと"
    doc_ref: "手順書: Outlook_pstコピー手順(cases/outlook-pst-migration の doc_ref と同一。pstを置く前提のアクセス権対処が未記載)"
    related:
      - outlook-pst-migration
    keywords:
      - "pst"
      - "Outlook"
      - "アクセスが拒否されました"
      - "アクセス権"
      - "読み取り専用"
      - "メール移行"
      - "PC入れ替え"
      - "Win10 Win11"
      - "SH-KIMITSU"
      - "保護がかかっている"
    severity: medium
    status: draft
