# ITサポート ナレッジベース 事例(3件目 / pst移行の派生トラブル)
#
# 位置づけ: PC入れ替えの過去メール(.pst)移行(outlook-pst-migration)に付随する
#           派生トラブル。pstを取り込もうとして「アクセスが拒否されました」で開けない。
#           関連性の橋渡し(related)の実例。
#
# 診断層(diagnosis/cause/resolution/verification/caveats)を継続採用。
# 真因は「手順書非準拠の我流インポート」が主。ファイル属性/権限は副次要因に格下げ。
# 現場での最終解決確認は未取得のため status: draft。

meta:
  updated: "2026-09-18"
  maintainer: "Kiro (AI保守) + 情シス"
  purpose: "AIが関連性を橋渡しするための構造化事例ベース。人間向け手順書は生成物。"
  note: >
    真因は『手順書どおりでない移行方法(Desktopに任意名pstを置き、置き換えではなくインポート)』が主。
    当初『pstの読み取り専用属性』を主因と推定したが、手順書準拠なら属性変更は不要=誤り。訂正済み。

cases:
  - id: outlook-pst-access-denied
    title: "移行した Outlook の .pst を取り込もうとすると『アクセスが拒否されました』で更新できない"
    category: メール
    symptoms:
      - "保護がかかっているのか更新ができない"
      - "過去メールの移行(以降)をしているが更新できない"
      - "データの吸い上げに何かの弊害があるみたい"
      - "pstにアクセスするための十分なアクセス権がありません と出る"
      - "移行したメールデータがOutlookで取り込めない/開けない"
    context:
      - "PC入れ替え(Win10→Win11)後の過去メール(.pst)移行作業中"
      - "旧PCからコピーした .pst を新PCのOutlookで取り込もうとした場面"
      - "貸与PC(キッティング済み)での初回セットアップ直後"
    # --- 診断(切り分け): まず手順書と実際の操作の食い違いを見る。前所有者環境の誤診に注意 ---
    diagnosis:
      - step: "エラーのファイルパスとファイル名が、手順書の指定と一致しているか確認"
        result: >
          実例のエラーは C:\Users\sh0480173.SH-KIMITSU\Desktop\データ移行 新パソコン\受信メール.pst。
          手順書の指定は ...\ドキュメント\Outlook ファイル\<メールアドレスと同名>.pst。
          置き場所(Desktop)・ファイル名(受信メール.pst)・操作(インポートウィザード使用)がいずれも手順書と食い違う
          → 手順書非準拠の我流移行になっている
      - step: "操作方法が『置き換え』か『インポート』かを確認"
        result: "手順書は『所定の場所の同名pstをファイルで置き換える』方式。実例は『Outlookデータファイルのインポート』を使用 → 別物の操作"
      - step: "前所有者(工事課等)の環境が残っているせいか？を検討"
        result: "貸与PCはキッティング(クリーンインストール+設定マニュアル適用)済み。前所有者残存が原因ではない → この線は除外"
      - step: "(手順書どおりにしても拒否が出る場合のみ)pstの状態を確認"
        result: >
          コピー中のロック/使用中、破損、OneDrive等の保護された場所・同期中、Outlook起動中、
          といった副次要因を確認。属性(読み取り専用)は手順書準拠なら通常無関係
    cause: >
      主因は『手順書どおりでない移行方法』。具体的には、旧PCの所定の場所にある「メールアドレスと同名のpst」を
      新PCの同じ場所へ置き換えるべきところを、Desktopに『受信メール.pst』という任意名で置き、
      Outlookの『データファイルのインポート』ウィザードで取り込もうとしたため、Outlookが対象pstを開けず拒否された。
      「保護がかかっている」ように見えるが、実体はセキュリティソフトやBitLockerではなく、この操作相違に起因する可能性が高い。
      (副次的に、コピー時のロック/使用中・破損・OneDrive等保護場所・Outlook起動中などが重なると拒否は起きうる。)
      「前所有者の環境が残っているせい」という誤診に流れやすいが、キッティング済みのため無関係。
    root_cause: "手順書非準拠の移行操作(Desktopに任意名pstを置き、置き換えでなくインポートで取り込み)によりOutlookがpstを開けずアクセス拒否(推定)。ファイル属性/権限は副次要因"
    targets: ["Outlook", ".pstファイル", "移行手順書", "Windows 11", "OneDrive(保護場所の可能性)"]
    resolution:
      - "Desktopでのインポート操作をやめる(手順書はインポート方式ではない)"
      - "旧PCの ...\\ドキュメント\\Outlook ファイル にある『メールアドレスと同名の .pst』をコピーする"
      - "新PCの同じ場所 ...\\ドキュメント\\Outlook ファイル を開き、既存の同名 .pst を旧PCの .pst で置き換える"
      - "作業中はOutlookを終了しておく(起動中はpstを操作できないことがある)"
      - "詳細は outlook-pst-migration の手順(doc_ref)に従う"
      - "(それでも拒否が出る場合のみ)pstがOneDrive配下等でないか・破損やコピー未完了でないかを確認し、必要なら副次的にファイル属性/アクセス権も点検する"
    verification:
      - "手順書どおりの置き換え後、Outlook起動時にアクセス拒否が出ず、過去メール・フォルダ階層が旧PC同様に表示されること"
      - "受信トレイ・送信済みなどが欠けなく見えること"
    caveats:
      - "当初の真因推定(pstの読み取り専用属性/NTFS権限)は誤り。手順書どおりなら属性変更は不要。主因は手順書非準拠の操作"
      - "真因はエラー内容と操作相違からの推定。現場での最終解決確認は未取得のため status: draft"
      - "移行手順書が Win10→Win11 の新しい移行に更新が追いついておらず、利用者が我流のインポートに走りやすい(手順書メンテ課題)"
      - "旧手順書には既に使われない Windows Live Mail の移行手順が残存している。整理対象"
      - "同一スレッドで発生していたExcel(管理簿配布予定表)のSQL Server ODBC接続エラーは、本件(メール移行)とは無関係の別トラブル。混同しないこと"
    doc_ref: "手順書: Outlook_pstコピー手順(cases/outlook-pst-migration の doc_ref と同一。置き換え方式であり、インポートは想定していない)"
    related:
      - outlook-pst-migration
      # 真因『キッティング時の初期設定漏れ』側の事例
      - pc-kitting-setup
    keywords:
      - "pst"
      - "Outlook"
      - "アクセスが拒否されました"
      - "インポート"
      - "受信メール.pst"
      - "メール移行"
      - "PC入れ替え"
      - "Win10 Win11"
      - "SH-KIMITSU"
      - "保護がかかっている"
      - "手順書非準拠"
    severity: medium
    status: draft
